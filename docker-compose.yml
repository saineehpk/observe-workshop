x-app: &app
  build: ./app
  restart: unless-stopped

# Every website is its own namespace with the same code (demo-customer-api + demo-withdraw-worker)
# but its own config and its own players, named after the site (alpha0001..alpha0050, bravo0001.., charlie0001..).
#   web-alpha    normal
#   web-bravo    the withdraw downstream is slower (traffic times out more often, the spike happens here)
#   web-charlie  replica lags 500ms behind (other sites 5ms), so the check-in consumer reads stale state
x-api-env: &api-env
  ROLE: api
  PORT: "8080"
  SERVICE_NAME: demo-customer-api
  OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
  OBSERVE_MODE: ${OBSERVE_MODE:-business}
  RPC_TIMEOUT_MS: "2000"
  CONSUMER_DELAY_MS: "20"
x-worker-env: &worker-env
  ROLE: worker
  PORT: "8081"
  SERVICE_NAME: demo-withdraw-worker
  OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
  OBSERVE_MODE: ${OBSERVE_MODE:-business}

services:
  # ingress for all websites: pick one with the X-Site header (production: the website's domain)
  gateway:
    <<: *app
    environment:
      ROLE: gateway
      PORT: "8080"
      SITES: >-
        web-alpha=http://api-alpha:8080|http://worker-alpha:8081,
        web-bravo=http://api-bravo:8080|http://worker-bravo:8081,
        web-charlie=http://api-charlie:8080|http://worker-charlie:8081
    ports: ["${API_PORT:-8080}:8080"]

  api-alpha:
    <<: *app
    environment: { <<: *api-env, NAMESPACE: web-alpha, WORKER_URL: "http://worker-alpha:8081", REPLICA_LAG_MS: "5" }
    labels: { workshop.observe: "true", service_name: demo-customer-api, namespace: web-alpha }
  worker-alpha:
    <<: *app
    environment: { <<: *worker-env, NAMESPACE: web-alpha }
    labels: { workshop.observe: "true", service_name: demo-withdraw-worker, namespace: web-alpha }

  api-bravo:
    <<: *app
    environment: { <<: *api-env, NAMESPACE: web-bravo, WORKER_URL: "http://worker-bravo:8081", REPLICA_LAG_MS: "5" }
    labels: { workshop.observe: "true", service_name: demo-customer-api, namespace: web-bravo }
  worker-bravo:
    <<: *app
    environment: { <<: *worker-env, NAMESPACE: web-bravo }
    labels: { workshop.observe: "true", service_name: demo-withdraw-worker, namespace: web-bravo }

  api-charlie:
    <<: *app
    environment: { <<: *api-env, NAMESPACE: web-charlie, WORKER_URL: "http://worker-charlie:8081", REPLICA_LAG_MS: "500" }
    labels: { workshop.observe: "true", service_name: demo-customer-api, namespace: web-charlie }
  worker-charlie:
    <<: *app
    environment: { <<: *worker-env, NAMESPACE: web-charlie }
    labels: { workshop.observe: "true", service_name: demo-withdraw-worker, namespace: web-charlie }

  loki:
    image: grafana/loki:3.2.0
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki-data:/loki

  prometheus:
    image: prom/prometheus:v2.55.0
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports: ["${PROMETHEUS_PORT:-9090}:9090"]

  alloy:
    image: grafana/alloy:v1.4.3
    command: run /etc/alloy/config.alloy
    environment:
      # only ship logs of this compose project, so two copies on one machine do not mix
      COMPOSE_PROJECT: ${COMPOSE_PROJECT_NAME:-}
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on: [loki]

  tempo:
    image: grafana/tempo:2.10.9
    command: -config.file=/etc/tempo.yaml
    user: "0"   # write to the named volume without a chown step (local, synthetic data)
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo

  grafana:
    image: grafana/grafana:13.2.4
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      # Editor เพื่อให้เปิด Explore ได้โดยไม่ต้อง login (Grafana ในเครื่อง ข้อมูลจำลอง)
      GF_AUTH_ANONYMOUS_ORG_ROLE: Editor
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports: ["${GRAFANA_PORT:-3000}:3000"]
    depends_on: [loki, prometheus, tempo]

volumes:
  loki-data:
  prometheus-data:
  tempo-data:
